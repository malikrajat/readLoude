<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Read Aloud with Highlight</title>
    <style>
      /* Every foreground/background pair below is checked by
         `npm run check` (see scripts/verify.js): text must reach a contrast
         ratio of at least 4.5:1, and the values are reported in CI. */
      :root {
        color-scheme: light dark;

        --bg: #ffffff;
        --text: #0f172a;
        --muted: #475569;
        --surface: #f1f5f9;
        --border: #cbd5e1;

        --on-accent: #ffffff;
        --read: #15803d;
        --read-hover: #166534;
        --pause: #b45309;
        --pause-hover: #92400e;
        --stop: #b91c1c;
        --stop-hover: #991b1b;

        --disabled-bg: #e2e8f0;
        --disabled-text: #475569;

        --status-reading-bg: #dcfce7;
        --status-reading-text: #14532d;
        --status-paused-bg: #ffedd5;
        --status-paused-text: #7c2d12;
        --status-stopped-bg: #fee2e2;
        --status-stopped-text: #7f1d1d;

        --hint-bg: #eff6ff;
        --hint-text: #1e3a8a;
        --warning-bg: #fff7ed;
        --warning-text: #7c2d12;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b1220;
          --text: #e2e8f0;
          --muted: #a3b1c6;
          --surface: #1e293b;
          --border: #334155;

          --disabled-bg: #1e293b;
          --disabled-text: #94a3b8;

          --status-reading-bg: #052e16;
          --status-reading-text: #86efac;
          --status-paused-bg: #431407;
          --status-paused-text: #fdba74;
          --status-stopped-bg: #450a0a;
          --status-stopped-text: #fca5a5;

          --hint-bg: #172554;
          --hint-text: #bfdbfe;
          --warning-bg: #431407;
          --warning-text: #fed7aa;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 360px;
        margin: 0;
        padding: 16px;
        background-color: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        font-size: 14px;
        line-height: 1.5;
      }

      h1 {
        margin: 0 0 2px;
        font-size: 17px;
        line-height: 1.3;
      }

      .subtitle {
        margin: 0 0 14px;
        color: var(--muted);
        font-size: 12.5px;
      }

      .controls {
        display: flex;
        gap: 8px;
      }

      button {
        flex: 1;
        min-height: 44px;
        padding: 8px 6px;
        border: 1px solid transparent;
        border-radius: 8px;
        color: var(--on-accent);
        font-family: inherit;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.01em;
        cursor: pointer;
      }

      button:focus-visible {
        outline: 3px solid var(--text);
        outline-offset: 2px;
      }

      #readBtn {
        background-color: var(--read);
      }

      #readBtn:hover:not(:disabled) {
        background-color: var(--read-hover);
      }

      #pauseBtn {
        background-color: var(--pause);
      }

      #pauseBtn:hover:not(:disabled) {
        background-color: var(--pause-hover);
      }

      #stopBtn {
        background-color: var(--stop);
      }

      #stopBtn:hover:not(:disabled) {
        background-color: var(--stop-hover);
      }

      button:disabled {
        background-color: var(--disabled-bg);
        border-color: var(--border);
        color: var(--disabled-text);
        cursor: not-allowed;
      }

      .status {
        margin-top: 12px;
        padding: 8px 10px;
        border-radius: 6px;
        font-size: 13.5px;
        font-weight: 600;
        text-align: center;
      }

      .status:empty {
        display: none;
      }

      .status.reading {
        background-color: var(--status-reading-bg);
        color: var(--status-reading-text);
      }

      .status.paused {
        background-color: var(--status-paused-bg);
        color: var(--status-paused-text);
      }

      .status.stopped {
        background-color: var(--status-stopped-bg);
        color: var(--status-stopped-text);
      }

      .hint {
        margin-top: 10px;
        padding: 10px 12px;
        border-radius: 6px;
        background-color: var(--hint-bg);
        color: var(--hint-text);
        font-size: 13px;
      }

      .warning {
        margin-top: 10px;
        padding: 10px 12px;
        border-radius: 6px;
        background-color: var(--warning-bg);
        color: var(--warning-text);
        font-size: 13px;
      }

      .hidden {
        display: none;
      }

      .settings {
        margin-top: 16px;
        padding-top: 14px;
        border-top: 1px solid var(--border);
      }

      label,
      .field-label {
        display: block;
        margin-bottom: 6px;
        color: var(--text);
        font-size: 12.5px;
        font-weight: 600;
      }

      .value {
        color: var(--muted);
        font-weight: 400;
      }

      select {
        width: 100%;
        min-height: 38px;
        margin-bottom: 14px;
        padding: 6px 8px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background-color: var(--bg);
        color: var(--text);
        font-family: inherit;
        font-size: 14px;
      }

      input[type="range"] {
        width: 100%;
        margin: 4px 0 14px;
        accent-color: var(--read);
      }

      .presets {
        display: flex;
        gap: 6px;
      }

      .presets button {
        min-height: 32px;
        padding: 4px 6px;
        border-color: var(--border);
        background-color: var(--surface);
        color: var(--text);
        font-size: 12.5px;
        font-weight: 600;
      }

      .presets button:hover:not(:disabled) {
        background-color: var(--border);
      }

      footer {
        margin-top: 16px;
        padding-top: 12px;
        border-top: 1px solid var(--border);
        color: var(--muted);
        font-size: 12px;
      }

      kbd {
        padding: 1px 5px;
        border: 1px solid var(--border);
        border-radius: 4px;
        background-color: var(--surface);
        color: var(--text);
        font-family: inherit;
        font-size: 11.5px;
      }
    </style>
  </head>
  <body>
    <h1>Read Aloud</h1>
    <p class="subtitle">Select text on a page (or open an article), then press Read.</p>

    <div class="controls">
      <button id="readBtn" type="button" title="Read the selected text aloud">Read</button>
      <button id="pauseBtn" type="button" title="Pause or resume reading" disabled>Pause</button>
      <button id="stopBtn" type="button" title="Stop reading" disabled>Stop</button>
    </div>

    <div id="status" class="status" role="status" aria-live="polite"></div>
    <div id="hint" class="hint hidden" role="alert"></div>

    <div class="settings">
      <label for="voice">Voice</label>
      <select id="voice" title="Pick the voice used for reading"></select>
      <div id="voiceWarning" class="warning hidden" role="status"></div>

      <label for="rate">Speed: <span class="value" id="rateValue">0.85</span></label>
      <input type="range" id="rate" min="0.5" max="2" step="0.05" value="0.85" />

      <label for="pitch">Pitch: <span class="value" id="pitchValue">1</span></label>
      <input type="range" id="pitch" min="0.5" max="2" step="0.05" value="1" />

      <span class="field-label">Presets</span>
      <div class="presets">
        <button id="presetSlow" type="button">Slow</button>
        <button id="presetNormal" type="button">Normal</button>
        <button id="presetFast" type="button">Fast</button>
      </div>
    </div>

    <footer>
      Reading pauses automatically when you switch tabs.<br />
      Open this popup with <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>R</kbd>.
    </footer>

    <script src="lib/core.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
